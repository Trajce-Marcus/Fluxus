<title>Fluxus — Console &amp; Runtime prototype</title>

<style>
/* ─── frame tokens (theme-aware) ─────────────────────────────────────── */
:root{
  --page-bg:#E8ECEB; --page-fg:#101A19; --page-dim:#5C6B6A; --page-line:#CDD5D3;
  --page-panel:#F7F9F8;
  --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root{ --page-bg:#0A0F10; --page-fg:#DCE5E4; --page-dim:#7E8F8E; --page-line:#1E2A2B; --page-panel:#0F1617; }
}
:root[data-theme="dark"]{ --page-bg:#0A0F10; --page-fg:#DCE5E4; --page-dim:#7E8F8E; --page-line:#1E2A2B; --page-panel:#0F1617; }
:root[data-theme="light"]{ --page-bg:#E8ECEB; --page-fg:#101A19; --page-dim:#5C6B6A; --page-line:#CDD5D3; --page-panel:#F7F9F8; }

*{ box-sizing:border-box; }
body{ margin:0; background:var(--page-bg); color:var(--page-fg); font-family:var(--ui); font-size:14px; }
button{ font:inherit; color:inherit; cursor:pointer; }
input,select,textarea{ font:inherit; }
:focus-visible{ outline:2px solid #38A3B8; outline-offset:1px; }

.wrap{ max-width:1360px; margin:0 auto; padding:18px 16px 40px; }

/* ─── instrument frame ───────────────────────────────────────────────── */
.frame-bar{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:8px 10px; border:1px solid var(--page-line); border-bottom:0;
  background:var(--page-panel); border-radius:6px 6px 0 0;
}
.brand{ font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--page-dim); }
.brand b{ color:var(--page-fg); font-weight:600; }
.seg{ display:flex; border:1px solid var(--page-line); border-radius:5px; overflow:hidden; }
.seg button{ background:transparent; border:0; padding:5px 12px; font-size:12.5px; color:var(--page-dim); }
.seg button[aria-pressed="true"]{ background:#38A3B8; color:#04191C; font-weight:600; }
.urlbar{
  flex:1 1 240px; min-width:180px; font-family:var(--mono); font-size:11.5px;
  color:var(--page-dim); background:var(--page-bg); border:1px solid var(--page-line);
  border-radius:5px; padding:5px 9px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.ctl{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--page-dim); }
.ctl select{
  background:var(--page-bg); color:var(--page-fg); border:1px solid var(--page-line);
  border-radius:5px; padding:4px 6px; font-size:11.5px;
}
.ctl-label{ font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; }

.viewport{ border:1px solid var(--page-line); border-radius:0 0 6px 6px; overflow:hidden; height:760px; position:relative; }
.frame-note{ margin:10px 2px 0; font-size:12px; color:var(--page-dim); line-height:1.6; max-width:74ch; }
.frame-note code{ font-family:var(--mono); font-size:11.5px; }

/* ─── shared app primitives ──────────────────────────────────────────── */
.app{ height:100%; display:flex; flex-direction:column; font-size:13px; }
.hidden{ display:none !important; }
.mono{ font-family:var(--mono); }
.spacer{ flex:1; }

/* ═══ CONSOLE (design plane — dark) ══════════════════════════════════ */
.console{
  --bg:#0E1416; --panel:#131A1D; --panel2:#182226; --line:#223034; --line2:#2C3A3F;
  --fg:#DDE6E6; --dim:#8FA0A3; --dim2:#6B7C7F;
  --acc:#38A3B8; --acc-soft:#123039; --amber:#E0A03C; --danger:#D2604F; --pos:#5FAF7E;
  background:var(--bg); color:var(--fg);
}
.console button{ color:var(--fg); }

.chdr{ display:flex; align-items:center; gap:10px; height:44px; padding:0 12px; background:var(--panel); border-bottom:1px solid var(--line); position:relative; z-index:30; }
.logo{ width:20px; height:20px; border-radius:4px; background:linear-gradient(140deg,#38A3B8,#1C6273); flex:none; }
.crumb{ display:flex; align-items:center; gap:7px; font-size:13.5px; }
.crumb .sep{ color:var(--dim2); }
.crumb .org{ color:var(--fg); font-weight:500; }
.crumb-btn{ background:transparent; border:1px solid transparent; border-radius:5px; padding:3px 7px; display:flex; align-items:center; gap:6px; }
.crumb-btn:hover{ background:var(--panel2); border-color:var(--line); }
.crumb-btn .caret{ color:var(--dim); font-size:10px; }

.menu{ position:absolute; top:38px; background:var(--panel2); border:1px solid var(--line2); border-radius:7px; padding:5px; min-width:240px; box-shadow:0 14px 34px rgba(0,0,0,.5); z-index:40; }
.menu-h{ font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim2); padding:6px 8px 4px; }
.menu button{ display:flex; width:100%; align-items:center; gap:8px; background:transparent; border:0; text-align:left; padding:6px 8px; border-radius:5px; font-size:13px; }
.menu button:hover{ background:#213035; }
.menu button .sub{ color:var(--dim2); font-family:var(--mono); font-size:10.5px; }
.menu .rule{ height:1px; background:var(--line); margin:5px 2px; }
.menu button[aria-current="true"]{ color:var(--acc); }

.pill{ font-size:11px; padding:2px 8px; border-radius:999px; border:1px solid var(--line2); color:var(--dim); }
.pill.authored{ border-color:#2E4249; color:#8FB4BC; }
.pill.installed{ border-color:#4A3B22; color:var(--amber); }
.pill.acc{ border-color:#1F4E5B; background:var(--acc-soft); color:#7FD0E0; }
.pill.warn{ border-color:#4A3B22; background:#241D10; color:var(--amber); }
.pill.pos{ border-color:#26452F; background:#12251A; color:var(--pos); }

.cbody{ flex:1; display:grid; grid-template-columns:228px 1fr; min-height:0; }
.cnav{ background:var(--panel); border-right:1px solid var(--line); padding:10px 8px; overflow:auto; display:flex; flex-direction:column; }
.nav-h{ font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim2); padding:12px 8px 5px; }
.nav-i{ display:flex; align-items:center; gap:9px; width:100%; background:transparent; border:0; text-align:left; padding:6px 9px; border-radius:5px; color:var(--dim); font-size:13px; }
.nav-i:hover{ background:var(--panel2); color:var(--fg); }
.nav-i[aria-current="true"]{ background:var(--acc-soft); color:#9FDDEA; font-weight:500; box-shadow:inset 2px 0 0 var(--acc); }
.nav-i .ico{ width:14px; text-align:center; color:var(--dim2); font-size:11px; }
.nav-i[aria-current="true"] .ico{ color:var(--acc); }
.nav-foot{ margin-top:auto; padding:10px 9px 2px; border-top:1px solid var(--line); font-size:11px; color:var(--dim2); font-family:var(--mono); }

.cmain{ min-width:0; min-height:0; overflow:auto; display:flex; flex-direction:column; }
.view{ padding:20px 24px 34px; }
.view.flush{ padding:0; height:100%; }
.vh{ display:flex; align-items:flex-end; gap:12px; margin-bottom:4px; }
.vh h1{ margin:0; font-size:19px; font-weight:600; letter-spacing:-.01em; }
.vsub{ color:var(--dim); font-size:12.5px; margin:0 0 18px; }
.vsub .mono{ color:var(--dim2); }

.card{ background:var(--panel); border:1px solid var(--line); border-radius:8px; }
.card-h{ padding:11px 14px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; font-weight:500; font-size:13px; }
.card-b{ padding:14px; }
.grid2{ display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:14px; }

table.tbl{ width:100%; border-collapse:collapse; font-size:12.5px; }
.tbl th{ text-align:left; font-family:var(--mono); font-size:9.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--dim2); font-weight:500; padding:8px 12px; border-bottom:1px solid var(--line); }
.tbl td{ padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:middle; }
.tbl tr:last-child td{ border-bottom:0; }
.tbl tbody tr:hover{ background:#161F22; }
.tbl td.num{ font-variant-numeric:tabular-nums; }
.tbl .id{ font-family:var(--mono); font-size:11.5px; color:var(--dim); }
.tbl-wrap{ overflow-x:auto; }

.btn{ background:var(--panel2); border:1px solid var(--line2); border-radius:5px; padding:5px 11px; font-size:12.5px; }
.btn:hover{ background:#213035; border-color:#385057; }
.btn.pri{ background:var(--acc); border-color:var(--acc); color:#04191C; font-weight:600; }
.btn.pri:hover{ background:#45B7CE; }
.btn.pri:disabled{ background:#1E3A42; border-color:#1E3A42; color:#5D7A81; cursor:not-allowed; }
.btn.sm{ padding:3px 8px; font-size:11.5px; }
.btn.danger{ color:var(--danger); border-color:#4A2A26; }
.btn.ghost{ background:transparent; border-color:transparent; color:var(--dim); }
.btn.ghost:hover{ color:var(--fg); background:var(--panel2); }
.btnrow{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }

label.f{ display:block; margin-bottom:12px; }
label.f > span{ display:block; font-size:11.5px; color:var(--dim); margin-bottom:5px; }
.inp{ width:100%; background:#0C1214; border:1px solid var(--line2); border-radius:5px; color:var(--fg); padding:6px 9px; font-size:12.5px; }
.inp:focus{ border-color:var(--acc); outline:none; }
textarea.inp{ font-family:var(--mono); font-size:11.5px; line-height:1.6; resize:vertical; }
.hint{ font-size:11px; color:var(--dim2); margin-top:5px; line-height:1.5; }
.ro{ display:flex; justify-content:space-between; gap:16px; padding:7px 0; border-bottom:1px solid var(--line); font-size:12.5px; }
.ro:last-child{ border-bottom:0; }
.ro span:first-child{ color:var(--dim); }

.md{ display:grid; grid-template-columns:250px 1fr; min-height:0; height:100%; }
.md-list{ border-right:1px solid var(--line); overflow:auto; background:var(--panel); }
.md-list-h{ display:flex; align-items:center; gap:8px; padding:9px 12px; border-bottom:1px solid var(--line); }
.md-list-h .t{ font-family:var(--mono); font-size:9.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--dim2); }
.li{ display:block; width:100%; text-align:left; background:transparent; border:0; border-bottom:1px solid var(--line); padding:9px 12px; }
.li:hover{ background:#161F22; }
.li[aria-current="true"]{ background:var(--acc-soft); box-shadow:inset 2px 0 0 var(--acc); }
.li .n{ font-size:12.5px; }
.li .s{ font-family:var(--mono); font-size:10.5px; color:var(--dim2); margin-top:2px; }
.md-detail{ overflow:auto; min-width:0; }

.tabs{ display:flex; gap:2px; padding:0 14px; border-bottom:1px solid var(--line); background:var(--panel); }
.tab{ background:transparent; border:0; border-bottom:2px solid transparent; padding:9px 12px; font-size:12.5px; color:var(--dim); }
.tab:hover{ color:var(--fg); }
.tab[aria-selected="true"]{ color:var(--fg); border-bottom-color:var(--acc); }

.toolbar{ display:flex; align-items:center; gap:10px; padding:9px 24px; border-bottom:1px solid var(--line); background:linear-gradient(180deg,#141C1F,#111819); }
.toolbar .lbl{ font-family:var(--mono); font-size:9.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--dim2); }

.empty{ padding:40px 24px; text-align:center; color:var(--dim); }
.empty h3{ margin:0 0 6px; font-size:14px; color:var(--fg); font-weight:500; }
.empty p{ margin:0; font-size:12.5px; max-width:46ch; margin-inline:auto; line-height:1.6; }

.notice{ border:1px solid #3A3018; background:#1C1811; border-radius:7px; padding:10px 13px; font-size:12.5px; color:#E4C384; line-height:1.6; }
.notice.info{ border-color:#1F3B44; background:#0F1B1F; color:#96C6D2; }

.chip{ display:inline-flex; align-items:center; gap:5px; font-family:var(--mono); font-size:10.5px; padding:2px 7px; border-radius:4px; border:1px solid var(--line2); color:var(--dim); }
.chip.on{ border-color:#1F4E5B; background:var(--acc-soft); color:#7FD0E0; }
.chips{ display:flex; flex-wrap:wrap; gap:5px; }

/* pages section */
.pages{ display:grid; grid-template-columns:206px 1fr auto; height:100%; min-height:0; }
.ptree{ border-right:1px solid var(--line); background:var(--panel); overflow:auto; }
.ptree-h{ display:flex; align-items:center; padding:8px 10px; border-bottom:1px solid var(--line); }
.ptree-h .t{ font-family:var(--mono); font-size:9.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--dim2); }
.pnode{ display:flex; align-items:center; gap:7px; width:100%; background:transparent; border:0; text-align:left; padding:5px 10px; font-size:12.5px; color:var(--dim); font-family:var(--mono); font-size:11.5px; }
.pnode:hover{ background:#161F22; color:var(--fg); }
.pnode[aria-current="true"]{ color:#9FDDEA; background:var(--acc-soft); }
.pfolder{ font-family:var(--mono); font-size:10.5px; letter-spacing:.05em; color:var(--dim2); padding:8px 10px 3px; }
.pmid{ display:grid; grid-template-rows:auto 1fr auto; min-width:0; min-height:0; }
.ptabs{ display:flex; align-items:stretch; background:var(--panel); border-bottom:1px solid var(--line); overflow-x:auto; }
.ptab{ display:flex; align-items:center; gap:8px; padding:7px 10px; border-right:1px solid var(--line); background:transparent; border-top:0; border-bottom:0; border-left:0; font-family:var(--mono); font-size:11.5px; color:var(--dim); white-space:nowrap; }
.ptab[aria-selected="true"]{ background:var(--bg); color:var(--fg); box-shadow:inset 0 -2px 0 var(--acc); }
.ptab .x{ opacity:.5; font-size:13px; }
.ptab .x:hover{ opacity:1; }
.ptab .dot{ width:6px; height:6px; border-radius:50%; background:var(--amber); }
.pcanvas{ overflow:auto; background:var(--bg); padding:16px; min-height:0; }
.pconsole{ border-top:1px solid var(--line); background:#0B1012; height:132px; display:flex; flex-direction:column; }
.pconsole-h{ display:flex; align-items:center; gap:10px; padding:5px 10px; border-bottom:1px solid var(--line); }
.pconsole-b{ flex:1; overflow:auto; padding:7px 10px; font-family:var(--mono); font-size:11px; line-height:1.75; color:var(--dim); }
.plog b{ color:#7FD0E0; font-weight:500; }
.plog .warn{ color:var(--amber); }
.pside{ width:236px; border-left:1px solid var(--line); background:var(--panel); overflow:auto; }
.comp{ display:flex; gap:9px; padding:8px 11px; border-bottom:1px solid var(--line); align-items:center; }
.comp .g{ width:22px; height:22px; border-radius:4px; background:#1B282C; display:grid; place-items:center; font-size:11px; color:var(--dim); }
.comp .n{ font-size:12px; }
.comp .d{ font-size:10.5px; color:var(--dim2); }

/* preview surface inside page editor */
.prev{ background:#F6F7F5; color:#16211F; border-radius:6px; padding:14px; }
.prev h4{ margin:0 0 10px; font-size:14px; }
.prev .board{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
.prev .col{ background:#EDF0EE; border-radius:6px; padding:8px; }
.prev .col h5{ margin:0 0 8px; font-size:10.5px; text-transform:uppercase; letter-spacing:.1em; color:#5A6B68; }
.prev .wo{ background:#fff; border:1px solid #DCE2E0; border-radius:5px; padding:8px; margin-bottom:7px; font-size:11.5px; }
.prev .wo b{ font-family:var(--mono); font-size:10.5px; color:#1F6F7A; display:block; }
.prev table{ width:100%; border-collapse:collapse; font-size:11.5px; }
.prev th{ text-align:left; font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:#5A6B68; padding:6px 8px; border-bottom:1px solid #DCE2E0; }
.prev td{ padding:6px 8px; border-bottom:1px solid #E8ECEA; }

/* workbench (light component inside dark console) */
.workbench{ background:#F6F7F5; color:#16211F; height:100%; display:grid; grid-template-columns:200px 1fr; font-size:12.5px; }
.workbench .wb-list{ border-right:1px solid #DCE2E0; background:#EFF2F0; overflow:auto; }
.workbench .wb-h{ font-family:var(--mono); font-size:9.5px; letter-spacing:.13em; text-transform:uppercase; color:#6B7B78; padding:9px 11px; border-bottom:1px solid #DCE2E0; }
.workbench .wb-i{ display:block; width:100%; text-align:left; background:transparent; border:0; border-bottom:1px solid #E4E8E6; padding:8px 11px; font-size:12.5px; color:#16211F; }
.workbench .wb-i:hover{ background:#E4E9E6; }
.workbench .wb-i[aria-current="true"]{ background:#DCEAEA; box-shadow:inset 2px 0 0 #1F6F7A; font-weight:500; }
.workbench .wb-i .s{ font-family:var(--mono); font-size:10px; color:#6B7B78; }
.workbench .wb-main{ overflow:auto; min-width:0; }
.workbench .wb-bar{ display:flex; align-items:center; gap:8px; padding:8px 12px; border-bottom:1px solid #DCE2E0; background:#fff; }
.workbench table{ width:100%; border-collapse:collapse; font-size:12px; }
.workbench th{ text-align:left; font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:#6B7B78; padding:7px 12px; border-bottom:1px solid #DCE2E0; }
.workbench td{ padding:8px 12px; border-bottom:1px solid #E8ECEA; }
.workbench tbody tr:hover{ background:#EFF2F0; cursor:pointer; }
.workbench tr[aria-selected="true"]{ background:#DCEAEA; }
.wbtn{ background:#fff; border:1px solid #CFD7D4; border-radius:5px; padding:4px 10px; font-size:12px; color:#16211F; }
.wbtn:hover{ background:#EFF2F0; }
.wbtn.pri{ background:#1F6F7A; border-color:#1F6F7A; color:#fff; font-weight:600; }
.wb-rec{ padding:12px; }
.wb-rec .fr{ display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid #E8ECEA; }
.wb-rec .fr span:first-child{ color:#6B7B78; }

/* dialog + toast */
.scrim{ position:absolute; inset:0; background:rgba(4,10,11,.62); display:grid; place-items:center; z-index:60; padding:20px; }
.dlg{ width:min(520px,100%); background:#141C1F; border:1px solid #2C3A3F; border-radius:9px; box-shadow:0 26px 60px rgba(0,0,0,.6); max-height:100%; overflow:auto; }
.dlg-h{ padding:13px 16px; border-bottom:1px solid #223034; font-weight:600; font-size:13.5px; }
.dlg-b{ padding:16px; }
.dlg-f{ padding:12px 16px; border-top:1px solid #223034; display:flex; gap:8px; justify-content:flex-end; align-items:center; }
.toasts{ position:absolute; right:14px; bottom:14px; display:flex; flex-direction:column; gap:8px; z-index:70; }
.toast{ background:#182226; border:1px solid #2C3A3F; border-left:3px solid var(--pos); border-radius:6px; padding:9px 13px; font-size:12.5px; color:#DDE6E6; box-shadow:0 10px 26px rgba(0,0,0,.5); max-width:340px; animation:tin .18s ease-out; }
.toast .m{ font-family:var(--mono); font-size:10.5px; color:#8FA0A3; margin-top:3px; }
@keyframes tin{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:none;} }
@media (prefers-reduced-motion: reduce){ .toast{ animation:none; } }

/* ═══ RUNTIME (run plane — light) ════════════════════════════════════ */
.runtime{
  --r-bg:#F6F7F5; --r-panel:#FFFFFF; --r-line:#DCE2E0; --r-line2:#CBD4D1;
  --r-fg:#16211F; --r-dim:#63736F; --r-acc:#1F6F7A; --r-acc-soft:#E2EEEF;
  background:var(--r-bg); color:var(--r-fg);
}
.runtime button{ color:var(--r-fg); }
.rhdr{ display:flex; align-items:center; gap:12px; height:52px; padding:0 14px; background:var(--r-panel); border-bottom:1px solid var(--r-line); position:relative; z-index:30; }
.ident{ display:flex; align-items:baseline; gap:9px; min-width:0; }
.ident .org{ font-size:12px; color:var(--r-dim); }
.ident .dot{ color:var(--r-line2); }
.ident .sol{ font-size:15px; font-weight:600; letter-spacing:-.01em; }
.opchip{ display:inline-flex; align-items:center; gap:6px; border:1px solid var(--r-line2); border-radius:999px; padding:3px 11px; font-size:12px; color:var(--r-dim); background:var(--r-bg); }
.opchip .led{ width:6px; height:6px; border-radius:50%; background:#4E9E76; }
.icobtn{ background:transparent; border:1px solid transparent; border-radius:6px; width:32px; height:32px; display:grid; place-items:center; position:relative; }
.icobtn:hover{ background:var(--r-bg); border-color:var(--r-line); }
.badge{ position:absolute; top:3px; right:3px; min-width:15px; height:15px; border-radius:8px; background:#C4553F; color:#fff; font-size:9.5px; display:grid; place-items:center; padding:0 4px; font-variant-numeric:tabular-nums; }
.uat{ display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--r-dim); }
.sw{ width:32px; height:18px; border-radius:9px; background:#CBD4D1; border:0; position:relative; padding:0; }
.sw::after{ content:""; position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%; background:#fff; transition:left .15s; }
.sw[aria-pressed="true"]{ background:var(--r-acc); }
.sw[aria-pressed="true"]::after{ left:16px; }
@media (prefers-reduced-motion: reduce){ .sw::after{ transition:none; } }

  const t={ id:Math.random().toString(36).slice(2), msg, meta };
  S.console.toasts.push(t); render();
  setTimeout(()=>{ S.console.toasts=S.console.toasts.filter(x=>x.id!==t.id); render(); }, 3800);
}

function consoleNav(){
  const c=S.console, set=SECTIONS[c.scope];
  let out='', lastGroup=null;
  if(c.scope==='workspace') out+=`<div class="nav-h">Workspace</div>`;
  set.forEach(sec=>{
    if(sec.group && sec.group!==lastGroup){ out+=`<div class="nav-h">${esc(sec.group)}</div>`; lastGroup=sec.group; }
    if(!sec.group && lastGroup){ out+=`<div style="height:6px"></div>`; lastGroup=null; }
    out+=`<button class="nav-i" data-act="section" data-id="${sec.id}" aria-current="${sec.id===c.section}">
      <span class="ico">${sec.ico}</span><span>${esc(sec.label)}</span>
      ${sec.id==='workbench'?'<span class="spacer"></span><span class="pill" style="font-size:10px">M15</span>':''}
    </button>`;
  });
  return `<nav class="cnav">${out}
    <div class="nav-foot">${c.scope==='workspace'?'section registry · workspace':'section registry · solution'}<br>shell/sections.tsx</div>
  </nav>`;
}

function menuItemsEditor(items, editable, opId){
  const row = (it,depth,idx,parent) => `
    <div style="display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;margin-bottom:6px;margin-left:${depth*20}px;background:${depth?'#101719':'var(--panel2)'}">
      <span class="mono" style="color:var(--dim2);font-size:10.5px">${it.items?'group':'item'}</span>
      <b style="font-size:12.5px">${esc(it.label)}</b>
      ${it.page?`<span class="chip">${esc(it.page)}${page(it.page)&&page(it.page).version>0?'':' <span style="color:var(--danger)">unpublished</span>'}</span>`:''}
      <span class="spacer"></span>
      <span class="chips">${(it.roles||[]).map(r=>`<span class="chip on">${esc(role(r)?role(r).name:r)}</span>`).join('')||'<span class="chip" style="color:var(--danger)">no roles → hidden</span>'}</span>
      ${editable?`<button class="btn sm ghost" data-act="menu-noop" title="Reorder">↕</button>
                  <button class="btn sm ghost danger" data-act="menu-remove" data-scope="${opId||'default'}" data-i="${idx}" data-p="${parent}">✕</button>`:''}
    </div>`;
  let out='';
  items.forEach((it,i)=>{ out+=row(it,0,i,-1); (it.items||[]).forEach((ch,j)=>{ out+=row(ch,1,j,i); }); });
  if(!items.length) out=`<div class="hint">Empty menu — the Runtime app shows its no-menu fallback.</div>`;
  if(editable) out+=`<div class="btnrow" style="margin-top:10px">
      <button class="btn sm" data-act="menu-add" data-scope="${opId||'default'}">Add item</button>
      <button class="btn sm" data-act="menu-add-group" data-scope="${opId||'default'}">Add group</button>
      <span class="hint" style="margin:0">One level of nesting max. Paths must resolve to published versions.</span></div>`;
  return out;
}

      <div class="grid2">

          ${a.type==='fk'?`<label class="f"><span>Target record type</span>
              <select class="inp" data-act="set-fk">${DB.recordTypes.map(r=>`<option value="${r.id}" ${r.id===a.fk?'selected':''}>${esc(r.name)} — ${esc(r.id)}</option>`).join('')}</select></label>
            <p class="hint">Renders as a record picker; the value stored is the target record id.</p>`
          : a.type==='list'?`<label class="f"><span>Options — one per line</span>
              <textarea class="inp" rows="5" data-bind="sdm">${esc((a.options||[]).join('\n'))}</textarea></label>`
          : a.type==='text'?`<label style="display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--dim)">
              <input type="checkbox" ${a.multiline?'checked':''} data-act="toggle-multiline"> Multiline</label>
            <p class="hint">Multiline renders a textarea in the activity form.</p>`
          : (a.type==='photo'||a.type==='file')?`<p class="hint" style="margin:0">Uploads go through the client's upload seam and are stored by value descriptor. Multi is configuration, not a separate type.</p>
            <div class="ro" style="margin-top:10px"><span>Accepted</span><span class="mono">${a.type==='photo'?'image/*':'any'}</span></div>
            <div class="ro"><span>Descriptor</span><span class="mono">{ url, name, size, taken_at? }</span></div>`
          : a.type==='composite'?`<p class="hint" style="margin:0">A composite is a row of sub-attribute references plus section markers, composed from this same pool.</p>`
          : `<p class="hint" style="margin:0">No extra configuration for <span class="mono">${esc(a.type)}</span>.</p>`}
        </div></div>
        <div class="card"><div class="card-h">Used by</div><div class="card-b">
          ${usedBy(a.key).length?usedBy(a.key).map(u=>`<div class="ro"><span>${esc(u.wf)} · ${esc(u.act)}</span>
            <span>${u.required?'<span class="pill warn">required</span>':'<span class="pill">optional</span>'}</span></div>`).join('')
            :'<div class="hint">Not used by any activity yet.</div>'}
        </div></div>
      </div>
    </div></div>
  </div>`;
}
function usedBy(key){
  const out=[];
  DB.workflows.forEach(w=>w.activities.forEach(a=>a.usages.forEach(u=>{
    if(u.kind==='attr'&&u.key===key) out.push({wf:w.name, act:a.name, required:u.required});
  })));
  return out;
}

/* ── solution: pages (the one document editor) ── */
function viewPages(){
  const c=S.console;
  const folders={};
  DB.pages.forEach(p=>{ const [f]=p.path.split('/'); (folders[f]=folders[f]||[]).push(p); });
  const tree=Object.entries(folders).map(([f,ps])=>`
    <div class="pfolder">${esc(f)}/</div>
    ${ps.map(p=>`<button class="pnode" data-act="open-page" data-id="${p.path}" aria-current="${p.path===c.activeTab}">
      <span>${esc(p.path.split('/')[1])}</span><span class="spacer"></span>
      ${p.version>0?`<span style="color:var(--dim2)">v${p.version}</span>`:'<span style="color:var(--amber)">draft</span>'}
    </button>`).join('')}`).join('');

  const active=c.activeTab?page(c.activeTab):null;
  const side = c.sidePanel==='components' ? `
    <div class="pside">
      <div class="ptree-h"><span class="t">Components</span><span class="spacer"></span>
        <button class="btn sm ghost" data-act="side" data-v="">✕</button></div>

         ['⌗','Board','group records by a field'],['◫','Form','activity capture surface'],
         ['◷','Metric','single aggregate'],['⤢','Splitter','two panes, resizable'],
         ['☰','Menu nav','role-filtered menu'],['⬓','Tabs','switch between slots']]
        .map(([g,n,d])=>`<div class="comp"><div class="g">${g}</div><div><div class="n">${esc(n)}</div><div class="d">${esc(d)}</div></div></div>`).join('')}
    </div>` : c.sidePanel==='search' ? `
    <div class="pside">
      <div class="ptree-h"><span class="t">Search</span><span class="spacer"></span>
        <button class="btn sm ghost" data-act="side" data-v="">✕</button></div>
      <div style="padding:10px"><input class="inp" placeholder="Find in pages…" value="crew"></div>
      <div style="padding:0 10px 10px">
        ${[['dispatch/board','crew_id column binding'],['dispatch/board','group by crew shift'],
           ['admin/crews','crew roster grid'],['assets/register','crew last on site']]
          .map(([p,m])=>`<div style="padding:7px 0;border-bottom:1px solid var(--line)">
            <div class="mono" style="font-size:11px;color:#7FD0E0">${esc(p)}</div>
            <div style="font-size:11.5px;color:var(--dim)">${esc(m)}</div></div>`).join('')}

  return `<div class="pages" style="grid-template-columns:206px 1fr ${c.sidePanel?'auto':'0'}">

      <div class="ptree-h"><span class="t">Pages</span><span class="spacer"></span>
        <button class="btn sm ghost" data-act="side" data-v="components" title="Components">◫</button>
        <button class="btn sm ghost" data-act="side" data-v="search" title="Search">⌕</button>
      </div>
      ${tree}
    </div>
    <div class="pmid">
      <div class="ptabs">
        ${c.openTabs.map(p=>`<button class="ptab" data-act="tab" data-id="${p}" aria-selected="${p===c.activeTab}">
          ${c.dirtyTabs.includes(p)?'<span class="dot"></span>':''}<span>${esc(p)}</span>
          <span class="x" data-act="close-tab" data-id="${p}">✕</span></button>`).join('')||'<div style="padding:8px 12px;color:var(--dim2);font-size:12px">No page open</div>'}

      </div>
      <div class="pcanvas">${active?pagePreview(active):`

function pagePreview(p){

  const body = p.path==='dispatch/board' ? `
      <div class="board">
        ${['Unassigned','Dispatched','On site','Complete'].map(col=>`
          <div class="col"><h5>${col}</h5>
            ${wos.filter(w=>w.status===col).map(w=>`<div class="wo"><b>${esc(w.id)}</b>${esc(w.name)}</div>`).join('')||'<div style="font-size:11px;color:#7A8A87">—</div>'}
          </div>`).join('')}
      </div>`
    : p.path==='assets/register' ? `
      <table><thead><tr><th>Tag</th><th>Asset</th><th>Status</th><th>Criticality</th><th>Last inspected</th></tr></thead>
      <tbody>${assets.map(a=>`<tr><td>${esc(a.id)}</td><td>${esc(a.name)}</td><td>${esc(a.status)}</td><td>${esc(a.criticality)}</td><td>${esc(a.last_inspected_at)}</td></tr>`).join('')}</tbody></table>`
    : p.path==='admin/crews' ? `
      <table><thead><tr><th>Crew</th><th>Shift</th><th>Depot</th></tr></thead>
      <tbody>${(recs.rt_crews||[]).map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.shift)}</td><td>${esc(c.depot)}</td></tr>`).join('')}</tbody></table>`
    : p.path==='admin/sites' ? `
      <table><thead><tr><th>Site</th><th>Region</th><th>Access</th></tr></thead>
      <tbody>${(recs.rt_sites||[]).map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.region)}</td><td>${esc(c.access_notes)}</td></tr>`).join('')}</tbody></table>`
    : `<div style="color:#5A6B68;font-size:12px">Composition in progress — no components placed yet.</div>`;
  return `

      <span class="chips">${p.access.map(r=>`<span class="chip on">${esc(role(r).name)}</span>`).join('')}</span>

    <div class="prev"><h4>${esc(p.name)}</h4>${body}</div>`;
}

  const acts=wf(r.workflow).activities;

  return `<div class="workbench">

        <tbody>${rows.map((row,i)=>`<tr aria-selected="${i===0}">

          <span class="spacer"></span>
          <span style="font-size:11px;color:#6B7B78">activities available on this record</span>

        <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
          ${acts.map(a=>`<button class="wbtn" data-act="wb-run" data-id="${a.id}">${esc(a.name)}</button>`).join('')}

      </div>`:''}

/* ── console assembly ── */

function findActivity(id){
  for(const w of DB.workflows){ const a=w.activities.find(x=>x.id===id); if(a) return a; }
  return DB.workflows[0].activities[0];
}

function renderRuntime(){
  const r=S.runtime, o=op(r.operationId), s=sol(o.solutionId);
  if(!r.signedIn) return `<div class="app runtime"><div class="signin"><div class="box">
      <div class="logo" style="margin:0 auto;width:26px;height:26px"></div>
      <h2>${esc(s.name)}</h2><p>${esc(DB.org.name)}</p>
      <input class="rinp" value="a.okafor@northwind-utilities.com" aria-label="Email">
      <input class="rinp" type="password" value="••••••••••" aria-label="Password">
      <button class="rbtn" data-act="sign-in">Sign in</button>
      <p style="margin-top:16px;font-size:10.5px;letter-spacing:.08em;color:#8B9995;font-family:var(--mono)">POWERED BY FLUXUS</p>
    </div></div></div>`;

  const menu = visibleMenu(effectiveMenu(r.operationId), r.role);
  const hasPublished = publishedPages().length>0 && r.operationId!=='op_dispatch_pilot';
  const navItems = menu.length ? menu.map(it=>it.items
      ? `<div class="rnav-g">${r.navCollapsed?'···':esc(it.label)}</div>
         ${it.items.map(ch=>`<button class="rnav-i rnav-sub" data-act="rt-page" data-id="${ch.page}" aria-current="${ch.page===r.page}">
            <span class="ico">▪</span>${r.navCollapsed?'':`<span>${esc(ch.label)}</span>`}</button>`).join('')}`
      : `<button class="rnav-i" data-act="rt-page" data-id="${it.page}" aria-current="${it.page===r.page}">
           <span class="ico">${it.label==='Dispatch'?'⇉':it.label==='Assets'?'▦':'◔'}</span>${r.navCollapsed?'':`<span>${esc(it.label)}</span>`}</button>`).join('')
    : (hasPublished
        ? `<div class="rnav-g">Pages</div>` + publishedPages().map(p=>`
            <button class="rnav-i" data-act="rt-page" data-id="${p.path}" aria-current="${p.path===r.page}">
              <span class="ico">❐</span>${r.navCollapsed?'':`<span>${esc(p.name)}</span>`}</button>`).join('')
        : '');

  return `<div class="app runtime">
    <header class="rhdr">
      <button class="icobtn" data-act="rt-nav" title="Toggle navigation">☰</button>
      <div class="ident"><span class="org">${esc(DB.org.name)}</span><span class="dot">·</span><span class="sol">${esc(s.name)}</span></div>
      <div class="spacer"></div>
      <div class="uat"><span>UAT</span><button class="sw" data-act="rt-uat" aria-pressed="${r.uat}" aria-label="UAT mode"></button></div>
      <button class="icobtn" data-act="rt-bell" title="Notifications">🔔<span class="badge">3</span></button>
      <span class="opchip"><span class="led"></span>${esc(o.name)}</span>
      <button class="icobtn" data-act="rt-menu" aria-expanded="${r.menuOpen}"><span class="avatar">${initials(user(r.userId).name)}</span></button>
      ${r.menuOpen?`<div class="rmenu">
        <div class="who"><div class="n">${esc(user(r.userId).name)}</div><div class="e">${esc(user(r.userId).email)}</div>
          <div style="margin-top:6px" class="chips">${rolesOf(r.userId,r.operationId).map(x=>`<span class="rpill">${esc(role(x).name)}</span>`).join('')||'<span class="rpill">no roles</span>'}</div></div>
        <button>Profile</button><button>Notification settings</button>
        <button data-act="sign-out">Sign out</button>
      </div>`:''}
    </header>
    ${r.uat?'<div class="uatstrip">UAT — this operation is running against acceptance data</div>':''}
    <div class="rbody">
      <nav class="rnav ${r.navCollapsed?'collapsed':''}">
        <div class="rnav-items">${navItems||`<div class="rnav-g">Menu</div><div style="padding:10px;font-size:11.5px;color:var(--r-dim)">${r.navCollapsed?'':'Nothing visible for your roles.'}</div>`}</div>
        <div class="rnav-foot">${r.navCollapsed?'ƒ':'POWERED BY FLUXUS'}</div>
      </nav>
      <main class="rmain">${runtimeContent(menu, hasPublished)}</main>
    </div>
  </div>`;
}
function initials(n){ return n.split(' ').map(x=>x[0]).join(''); }
function visibleMenu(items, roleId){
  return items.filter(it=>{
    const ok=(it.roles||[]).includes(roleId);
    if(it.items){ const kids=it.items.filter(c=>(c.roles||[]).includes(roleId)); it._kids=kids; return ok&&kids.length; }
    return ok;
  }).map(it=>it.items?{...it, items:it._kids}:it);
}
function runtimeContent(menu, hasPublished){
  const r=S.runtime;
  if(!hasPublished) return `<div class="rempty"><div>
    <div class="t">Nothing published yet</div>
    <div class="d">This operation's solution has no published pages. An implementer publishes a page in the Console and it appears here — there is no workbench escape hatch in the Runtime app.</div></div></div>`;
  const flat=[]; menu.forEach(it=>it.items?it.items.forEach(c=>flat.push(c)):flat.push(it));
  const current=flat.find(x=>x.page===r.page)||flat[0];
  if(!current) return `<div class="rempty"><div>
    <div class="t">Nothing open</div>
    <div class="d">No menu item is visible for your roles in ${esc(op(r.operationId).name)}. Menus are deny-default — an operation admin assigns roles in the Console.</div></div></div>`;
  const recs=DB.records[r.operationId]||{};
  if(current.page==='dispatch/board') return rtBoard(recs);
  if(current.page==='assets/register') return rtAssets(recs);
  if(current.page==='admin/crews') return rtSimple('Crews','Roster for this operation', recs.rt_crews||[], [['name','Crew'],['shift','Shift'],['depot','Depot']]);
  if(current.page==='admin/sites') return rtSimple('Sites','Where the assets live', recs.rt_sites||[], [['name','Site'],['region','Region'],['access_notes','Access notes']]);
  return `<div class="rempty"><div><div class="t">${esc(current.label)}</div><div class="d">This page has no published composition.</div></div></div>`;
}
function rtBoard(recs){
  const wos=recs.rt_work_orders||[], cols=['Unassigned','Dispatched','On site','Complete'];
  const sev=w=>w.priority==='Critical'||w.priority==='High'?'hi':w.priority==='Medium'?'med':'lo';
  return `<div class="rpage">
    <h1>Dispatch board</h1><p class="rsub">Work orders across ${esc(op(S.runtime.operationId).name)} · ${wos.length} open items</p>
    <div class="board">${cols.map(c=>{
      const items=wos.filter(w=>w.status===c);
      return `<div class="bcol"><h3>${c}<span>${items.length}</span></h3>
        ${items.map(w=>`<div class="wo"><span class="sev ${sev(w)}"></span>
          <div class="id">${esc(w.id)}</div><div class="t">${esc(w.name)}</div>
          <div class="m"><span>${esc(w.asset_id)}</span><span>${esc(w.crew_id||'unassigned')}</span></div></div>`).join('')
          ||'<div style="font-size:11.5px;color:var(--r-dim);padding:4px 2px">Nothing here</div>'}
      </div>`;}).join('')}</div>
    <p class="rsub" style="margin-top:18px">Published <span class="mono">dispatch/board</span> v${page('dispatch/board').version} · drafts never leave the Console.</p>
  </div>`;
}
function rtAssets(recs){
  const assets=recs.rt_assets||[];
  const pill=a=>a.status==='In service'?'ok':a.status==='Out of service'?'crit':'warn';
  return `<div class="rpage">
    <h1>Asset register</h1><p class="rsub">${assets.length} assets in ${esc(op(S.runtime.operationId).name)}</p>
    <div class="rcard"><div class="rcard-h">Assets<span class="spacer"></span>
      <span class="rpill">${assets.filter(a=>a.criticality==='Critical').length} critical</span></div>
      <table class="rtbl"><thead><tr><th>Tag</th><th>Asset</th><th>Status</th><th>Criticality</th><th>Site</th><th>Last inspected</th></tr></thead>
        <tbody>${assets.map(a=>`<tr><td class="mono" style="font-family:var(--mono);font-size:11.5px;color:var(--r-acc)">${esc(a.id)}</td>
          <td><b>${esc(a.name)}</b></td><td><span class="rpill ${pill(a)}">${esc(a.status)}</span></td>
          <td>${esc(a.criticality)}</td><td>${esc(a.site_id)}</td>
          <td style="font-variant-numeric:tabular-nums">${esc(a.last_inspected_at)}</td></tr>`).join('')}</tbody></table>
    </div>
  </div>`;
}
function rtSimple(title,sub,rows,cols){
  return `<div class="rpage"><h1>${esc(title)}</h1><p class="rsub">${esc(sub)}</p>
    <div class="rcard"><table class="rtbl">
      <thead><tr>${cols.map(c=>`<th>${esc(c[1])}</th>`).join('')}</tr></thead>
      <tbody>${rows.length?rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c[0]]??'—')}</td>`).join('')}</tr>`).join('')
        :`<tr><td colspan="${cols.length}" style="color:var(--r-dim);text-align:center;padding:24px">No records</td></tr>`}</tbody>
    </table></div></div>`;
}

function openSolution(id){
  const c=S.console;
  if(c.sdmDirty && SDM_SECTIONS.includes(c.section)){ c.pendingNav={kind:'solution',id}; c.dialog={kind:'leave-guard'}; return render(); }
  c.scope='solution'; c.solutionId=id; c.section='overview'; c.openMenu=null;
  const ops=opsFor(id); c.dataOperationId=ops.length?ops[0].id:null;
  log('info',`engine.openSolution(${id}${c.dataOperationId?', '+c.dataOperationId:''}) → connectSolution → scopeVersion++`);
  render();
}
function exitSolution(){
  const c=S.console;
  if(c.sdmDirty && SDM_SECTIONS.includes(c.section)){ c.pendingNav={kind:'exit'}; c.dialog={kind:'leave-guard'}; return render(); }
  c.scope='workspace'; c.solutionId=null; c.section='solutions'; c.openMenu=null; render();
}
function resumeNav(){
  const c=S.console, p=c.pendingNav; c.pendingNav=null; c.dialog=null;
  if(!p) return render();
  if(p.kind==='section'){ c.section=p.id; }
  else if(p.kind==='solution'){ c.scope='solution'; c.solutionId=p.id; c.section='overview'; const ops=opsFor(p.id); c.dataOperationId=ops.length?ops[0].id:null; }
  else { c.scope='workspace'; c.solutionId=null; c.section='solutions'; }
  c.openMenu=null; render();
}

/* ══ events ═════════════════════════════════════════════════════════ */
const stage=document.getElementById('stage');
document.addEventListener('click', e=>{
  const t=e.composedPath()[0];
  const el=t.closest?.('[data-act]'); const c=S.console, r=S.runtime;

  /* outside-click closes open menus */
  if(!el || !['toggle-menu','rt-menu'].includes(el.dataset.act)){
    if(c.openMenu && !t.closest?.('.menu')) { c.openMenu=null; if(!el) return render(); }
    if(r.menuOpen && !t.closest?.('.rmenu')) { r.menuOpen=false; if(!el) return render(); }
  }
  if(!el) return;
  const a=el.dataset.act, id=el.dataset.id, v=el.dataset.v;

  switch(a){
    /* frame */
    case 'app': S.app=v; render(); break;

    /* console shell */
    case 'toggle-menu': c.openMenu = c.openMenu===v?null:v; render(); break;
    case 'section': goSection(id); break;
    case 'open-solution': openSolution(id); break;
    case 'exit-solution': exitSolution(); break;
    case 'set-data-op':
      c.dataOperationId=id; c.openMenu=null;
      log('info',`data operation → ${id} · reconnect + remount`);
      toast(`Building against ${op(id).name}`, 'connectSolution({ solutionId, operationId }) · views remounted'); break;
    case 'open-runtime':
      S.app='runtime'; r.operationId=id; r.page=(effectiveMenu(id)[0]||{}).page||'dispatch/board';
      r.selAsset=null; render(); break;

    /* organisation */
    case 'save-org':
      DB.org.name=c.orgForm.name; DB.org.contactEmail=c.orgForm.contactEmail; c.orgDirty=false;
      toast('Organisation profile saved','orgs.putProfile — name + contact email only'); break;
    case 'reset-org': c.orgForm={name:DB.org.name, contactEmail:DB.org.contactEmail}; c.orgDirty=false; render(); break;

    /* operations */
    case 'sel-operation': c.selOperation=id; c.opTab='overview'; render(); break;
    case 'op-tab': c.opTab=id; render(); break;
    case 'override-menu':
      DB.opMenus[id]=JSON.parse(JSON.stringify(DB.defaultMenu));
      toast('Menu overridden','Solution default copied into the operation — whole-menu replacement'); break;
    case 'revert-menu':
      delete DB.opMenus[id];
      toast('Reverted to inherit','operations.putConfig — menu key removed'); break;
    case 'menu-remove':{
      const list = el.dataset.scope==='default'?DB.defaultMenu:DB.opMenus[el.dataset.scope];
      const p=+el.dataset.p, i=+el.dataset.i;
      if(p<0) list.splice(i,1); else list[p].items.splice(i,1);
      render(); break; }
    case 'menu-add':{
      const list = el.dataset.scope==='default'?DB.defaultMenu:DB.opMenus[el.dataset.scope];
      list.push({ label:'Inspections', page:'assets/detail', roles:['role_technicians'] });
      toast('Item added','Path checked against published versions at save'); break; }
    case 'menu-add-group':{
      const list = el.dataset.scope==='default'?DB.defaultMenu:DB.opMenus[el.dataset.scope];
      list.push({ label:'Reports', roles:['role_auditors'], items:[{ label:'Uptime', page:'reports/uptime', roles:['role_auditors'] }] });
      toast('Group added','reports/uptime is unpublished — save will reject it until it is'); break; }
    case 'toggle-role':{
      const as=DB.assignments.find(x=>x.userId===el.dataset.u&&x.operationId===el.dataset.o);
      as.roles = as.roles.includes(el.dataset.r) ? as.roles.filter(x=>x!==el.dataset.r) : [...as.roles, el.dataset.r];
      render(); break; }
    case 'set-level': break;
    case 'rm-implementer': DB.implementers.splice(+el.dataset.i,1); toast('Implementer level removed','implementers.put'); break;

    /* sdm */
    case 'sel-rt': c.selRecordType=id; render(); break;
    case 'sel-attr': c.selAttribute=id; render(); break;
    case 'sel-wf': c.selWorkflow=id; c.selActivity=(wf(id).activities[0]||{}).id; render(); break;
    case 'sel-act': c.selActivity=id; render(); break;
    case 'add-field': rt(c.selRecordType).fields.push({key:'new_field',type:'text',label:'New field'}); c.sdmDirty=true; render(); break;
    case 'rm-field': rt(c.selRecordType).fields.splice(+el.dataset.i,1); c.sdmDirty=true; render(); break;
    case 'toggle-read-role':{
      const rec=rt(c.selRecordType), k=el.dataset.r;
      rec.readRoles = rec.readRoles.includes(k)?rec.readRoles.filter(x=>x!==k):[...rec.readRoles,k];
      c.sdmDirty=true; render(); break; }
    case 'add-record-type':
      DB.recordTypes.push({id:'rt_new_type',name:'New type',workflow:'wf_assets',readRoles:[],fields:[]});
      c.selRecordType='rt_new_type'; c.sdmDirty=true; render(); break;
    case 'add-attribute':
      DB.attributes.push({key:'at_new_attribute',label:'New attribute',type:'text',multi:false,multiline:false});
      c.selAttribute='at_new_attribute'; c.sdmDirty=true; render(); break;
    case 'add-workflow':
      DB.workflows.push({id:'wf_new',name:'New workflow',description:'',activities:[]});
      c.selWorkflow='wf_new'; c.selActivity=null; c.sdmDirty=true; render(); break;
    case 'add-activity':{
      const w=wf(c.selWorkflow);
      w.activities.push({id:'act_new_'+w.id.replace('wf_',''),name:'New activity',description:'',sort:(w.activities.length+1)*10,
        recordMap:DB.recordTypes[0].id,showCondition:'',usages:[],before:'',after:''});
      c.selActivity=w.activities[w.activities.length-1].id; c.sdmDirty=true; render(); break; }
    case 'add-role': DB.roles.push({id:'role_new',name:'New role',description:''}); c.sdmDirty=true; render(); break;
    case 'usage-add':{
      const sel=document.getElementById('usage-pick');
      findActivity(c.selActivity).usages.push({kind:'attr',key:sel.value,required:false}); c.sdmDirty=true; render(); break; }
    case 'usage-section':
      findActivity(c.selActivity).usages.push({kind:'section',label:'New section'}); c.sdmDirty=true; render(); break;
    case 'usage-req':{
      const u=findActivity(c.selActivity).usages[+el.dataset.i]; u.required=!u.required; c.sdmDirty=true; render(); break; }
    case 'usage-rm': findActivity(c.selActivity).usages.splice(+el.dataset.i,1); c.sdmDirty=true; render(); break;
    case 'usage-up':{ const us=findActivity(c.selActivity).usages, i=+el.dataset.i;
      if(i>0){ [us[i-1],us[i]]=[us[i],us[i-1]]; c.sdmDirty=true; } render(); break; }
    case 'usage-down':{ const us=findActivity(c.selActivity).usages, i=+el.dataset.i;
      if(i<us.length-1){ [us[i+1],us[i]]=[us[i],us[i+1]]; c.sdmDirty=true; } render(); break; }
    case 'save-config':
      c.sdmDirty=false;
      log('info','config.put → solution reloaded, model rebuilt, scopeVersion++');
      toast('Model draft saved','config.put · solution reloaded · every view remounted'); break;

    /* pages */
    case 'open-page':
      if(!c.openTabs.includes(id)) c.openTabs.push(id);
      c.activeTab=id; render(); break;
    case 'tab': c.activeTab=id; render(); break;
    case 'close-tab':
      e.stopPropagation();
      c.openTabs=c.openTabs.filter(x=>x!==id);
      if(c.activeTab===id) c.activeTab=c.openTabs[c.openTabs.length-1]||null;
      render(); break;
    case 'side': c.sidePanel = v||null; render(); break;
    case 'toggle-console': c.consoleOpen=!c.consoleOpen; render(); break;
    case 'clear-log': c.log=[]; render(); break;

    /* dialogs */
    case 'dlg': c.dialog={kind:v}; render(); break;
    case 'close-dlg': c.dialog=null; render(); break;
    case 'close-dlg-bg': if(t.classList.contains('scrim')){ c.dialog=null; render(); } break;
    case 'leave-discard': c.sdmDirty=false; resumeNav(); toast('Draft changes discarded','canLeave guard'); break;
    case 'leave-save': c.sdmDirty=false; resumeNav(); toast('Model draft saved','config.put · then navigation resumed'); break;

    case 'create-solution':{
      const n=document.getElementById('dlg-name').value.trim()||'Untitled solution';
      const sid=document.getElementById('dlg-id').value.trim()||('sol_'+n.toLowerCase().replace(/\W+/g,'_'));
      DB.solutions.push({id:sid,name:n,origin:'authored',originRef:null,created:'2026-07-30'});
      c.dialog=null; toast(`${n} created`,'solutions.create — no operations, no records yet'); break; }
    case 'create-operation':{
      const n=document.getElementById('dlg-name').value.trim()||'New operation';
      const sid=document.getElementById('dlg-sol').value;
      const oid='op_'+n.toLowerCase().replace(/\W+/g,'_');
      DB.operations.push({id:oid,name:n,solutionId:sid,created:'2026-07-30',menuOverride:false});
      DB.records[oid]={rt_assets:[],rt_work_orders:[],rt_sites:[],rt_inspections:[],rt_crews:[]};
      c.selOperation=oid; c.dialog=null;
      toast(`${n} created`,`Linked to ${sol(sid).name} — permanently`); break; }
    case 'create-assignment':{
      const uid=document.getElementById('dlg-user').value;
      const roles=[...document.querySelectorAll('#dlg-roles .chip.on')].map(x=>x.dataset.r);
      const ex=DB.assignments.find(x=>x.userId===uid&&x.operationId===c.selOperation);
      if(ex) ex.roles=roles; else DB.assignments.push({userId:uid,operationId:c.selOperation,roles});
      c.dialog=null; toast('Roles assigned','assignments.put — (org, operation, user) → roleIds'); break; }
    case 'dlg-role': el.classList.toggle('on'); break;

    case 'publish-page':{
      const p=page(c.activeTab), readme=document.getElementById('dlg-readme').value.trim();
      p.version+=1; (DB.pageVersions[p.path]=DB.pageVersions[p.path]||[]).unshift({v:p.version,readme,by:'a.okafor',at:'2026-07-30 14:02'});
      c.dirtyTabs=c.dirtyTabs.filter(x=>x!==p.path); c.dialog=null;
      log('info',`pages.publish(${p.path}) → page_versions v${p.version}`);
      toast(`${p.path} published v${p.version}`,'Snapshotted into page_versions — append-only'); break; }
    case 'rollback-page':{
      const p=page(c.activeTab), from=+v;
      const src=(DB.pageVersions[p.path]||[]).find(x=>x.v===from);
      p.version+=1; DB.pageVersions[p.path].unshift({v:p.version,readme:`Republished v${from}: ${src.readme}`,by:'a.okafor',at:'2026-07-30 14:06'});
      c.dialog=null; toast(`v${from} republished as v${p.version}`,'Rollback never deletes or edits a version'); break; }
    case 'publish-config':{
      const readme=document.getElementById('dlg-readme').value.trim();
      DB.configVersions.unshift({v:DB.configVersions[0].v+1,readme,by:'a.okafor',at:'2026-07-30 14:09'});
      c.sdmDirty=false; c.dialog=null;
      log('info',`config.publish → sdm_config_versions v${DB.configVersions[0].v}`);
      toast(`Model published v${DB.configVersions[0].v}`,'default_menu travels with the model'); break; }
    case 'rollback-config':{
      const from=+v, src=DB.configVersions.find(x=>x.v===from);
      DB.configVersions.unshift({v:DB.configVersions[0].v+1,readme:`Rolled back to v${from}: ${src.readme}`,by:'a.okafor',at:'2026-07-30 14:11'});
      c.dialog=null; toast(`Rolled back to v${from}`,'Republished as the latest version and restored as the draft'); break; }

    /* workbench */
    case 'wb-run': c.dialog={kind:'run-activity',activityId:id}; render(); break;
    case 'wb-csv': c.dialog={kind:'csv'}; render(); break;
    case 'wb-schema': c.dialog={kind:'schema'}; render(); break;
    case 'run-activity':{
      const act=findActivity(c.dialog.activityId); c.dialog=null;
      log('info',`engine.runActivity(${act.id}) → committed to ${c.dataOperationId}`);
      toast(`${act.name} ran`,`Committed to ${op(c.dataOperationId).name} — the Runtime app sees it too`); break; }

    /* runtime */
    case 'rt-nav': r.navCollapsed=!r.navCollapsed; render(); break;
    case 'rt-menu': r.menuOpen=!r.menuOpen; render(); break;
    case 'rt-uat': r.uat=!r.uat; render(); break;
    case 'rt-bell': render(); break;
    case 'rt-page': r.page=id; render(); break;
    case 'sign-out': r.signedIn=false; r.menuOpen=false; render(); break;
    case 'sign-in': r.signedIn=true; render(); break;
  }
});

/* live-bound inputs (no re-render, so typing keeps focus) */
document.addEventListener('input', e=>{
  const el=e.target.closest?.('[data-bind]'); if(!el) return;
  const b=el.dataset.bind;
  if(b==='org.name'){ S.console.orgForm.name=el.value; markOrgDirty(); }
  else if(b==='org.contactEmail'){ S.console.orgForm.contactEmail=el.value; markOrgDirty(); }
  else if(b==='sdm'){ if(!S.console.sdmDirty){ S.console.sdmDirty=true; render(); } }
});
function markOrgDirty(){ if(!S.console.orgDirty){ S.console.orgDirty=true; render(); } }

/* selects that need model writes */
document.addEventListener('change', e=>{
  const el=e.target.closest?.('[data-act]'); if(!el) return;
  const c=S.console;
  switch(el.dataset.act){
    case 'jump':{
      const [scope,sec]=el.value.split(':'); if(!sec) return;
      if(scope==='w'){ c.scope='workspace'; c.solutionId=null; c.section=sec; }
      else { c.scope='solution'; c.solutionId=c.solutionId||'sol_asset_maintenance';
             const ops=opsFor(c.solutionId); c.dataOperationId=ops.length?ops[0].id:null; c.section=sec; }
      c.sdmDirty=false; render(); break; }
    case 'bind-wf': rt(c.selRecordType).workflow=el.value; c.sdmDirty=true; render(); break;
    case 'set-attr-type': attr(c.selAttribute).type=el.value; c.sdmDirty=true; render(); break;
    case 'set-fk': attr(c.selAttribute).fk=el.value; c.sdmDirty=true; render(); break;
    case 'toggle-multi': attr(c.selAttribute).multi=el.checked; c.sdmDirty=true; render(); break;
    case 'toggle-multiline': attr(c.selAttribute).multiline=el.checked; c.sdmDirty=true; render(); break;
    case 'set-level': DB.implementers[+el.dataset.i].level=el.value; toast('Implementer level updated','implementers.put — admin gated'); break;
    case 'rt-role': S.runtime.role=el.value; render(); break;
    case 'rt-op':{
      S.runtime.operationId=el.value;
      const m=visibleMenu(effectiveMenu(el.value), S.runtime.role);
      S.runtime.page=(m[0]&&(m[0].page||(m[0].items&&m[0].items[0].page)))||'dispatch/board';
      render(); break; }
  }
});

document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ S.console.dialog=null; S.console.openMenu=null; S.runtime.menuOpen=false; render(); } });

render();
</script>
